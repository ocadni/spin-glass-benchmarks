name: sgbench-solvers-mac-gpu
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.12.2
  - numpy=2.2.3
  - pytorch=2.7.0=*gpu_mps*    # Metal (MPS) accelerated PyTorch for Apple Silicon
  - pytest=9.0.3
  - pandas=2.2.3
  - networkx=3.4.2
  - tqdm=4.67.1
  - psutil=6.1.1               # For experiment framework machine specs
  - pip:
    - py-cpuinfo               # For experiment framework (optional, better CPU info)
