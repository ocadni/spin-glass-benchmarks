name: sgbench-solvers-gpu
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.2
  - pytorch                   # GPU-enabled PyTorch (latest compatible)
  - pytorch-cuda              # Conda-managed CUDA toolkit (no system CUDA needed)
  - pytest
  - pandas
  - networkx
  - tqdm
  - psutil                    # For experiment framework machine specs
  - pip
  - pip:
    - py-cpuinfo              # For experiment framework (optional, better CPU info)
