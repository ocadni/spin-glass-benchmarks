name: sgbench-solvers-core
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.12.2
  - numpy=2.2.3
  - pytorch=2.7.0=*cpu*       # CPU-only PyTorch
  - pytest=9.0.3
  - pandas=2.2.3
  - networkx=3.4.2
  - tqdm=4.67.1
  - psutil=6.1.1              # For experiment framework machine specs
  - pip:
    - py-cpuinfo              # For experiment framework (optional, better CPU info)
