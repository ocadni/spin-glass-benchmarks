project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - problem_definition.qmd
    - literature_references.qmd
    - results.qmd
    - file_format.qmd
    - project_contract.qmd

website:
  title: "Spin-Glass and XORSAT Benchmarks"
  site-url: "https://ocadni.github.io/spin-glass-benchmarks/"
  repo-url: "https://github.com/ocadni/spin-glass-benchmarks"
  repo-subdir: docs
  repo-actions: [source, issue]
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Problems"
        href: problem_definition.qmd
      - text: "Literature"
        href: literature_references.qmd
      - text: "Results"
        href: results.qmd
    right:
      - icon: github
        href: "https://github.com/ocadni/spin-glass-benchmarks"
        aria-label: "GitHub repository"
  page-footer:
    left: "Spin-Glass and XORSAT Benchmarks"
    right: "Built with Quarto"

format:
  html:
    theme: cosmo
    html-math-method: mathjax
    toc: true
    toc-depth: 3
    code-copy: true
    code-fold: true
    css: styles.css

bibliography: references.bib
link-citations: true
reference-section-title: "References"

execute:
  freeze: auto
