<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="title desc">
  <title id="title">Spin-glass coupling graph</title>
  <desc id="desc">A stylized network with positive and negative couplings shown as blue and red edges.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#263238" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="18" y="18" width="524" height="384" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <g fill="none" stroke-linecap="round" stroke-width="4">
    <path d="M112 92 L224 76 L338 118 L445 86" stroke="#277da1"/>
    <path d="M112 92 L165 210 L224 76 L282 224" stroke="#d95d39"/>
    <path d="M338 118 L282 224 L445 86 L454 250" stroke="#277da1"/>
    <path d="M165 210 L282 224 L388 318 L454 250" stroke="#d95d39"/>
    <path d="M112 92 L282 224 L388 318" stroke="#277da1" stroke-dasharray="10 12"/>
    <path d="M224 76 L338 118 L388 318" stroke="#d95d39" stroke-dasharray="10 12"/>
    <path d="M165 210 L95 310 L252 338 L388 318" stroke="#277da1"/>
    <path d="M95 310 L282 224 L252 338 L454 250" stroke="#d95d39"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <g fill="#17324d">
      <circle cx="112" cy="92" r="22"/>
      <circle cx="224" cy="76" r="22"/>
      <circle cx="338" cy="118" r="22"/>
      <circle cx="445" cy="86" r="22"/>
      <circle cx="165" cy="210" r="22"/>
      <circle cx="282" cy="224" r="22"/>
      <circle cx="454" cy="250" r="22"/>
      <circle cx="95" cy="310" r="22"/>
      <circle cx="252" cy="338" r="22"/>
      <circle cx="388" cy="318" r="22"/>
    </g>
    <g fill="#ffffff">
      <text x="112" y="98">-1</text>
      <text x="224" y="82">+1</text>
      <text x="338" y="124">-1</text>
      <text x="445" y="92">+1</text>
      <text x="165" y="216">+1</text>
      <text x="282" y="230">-1</text>
      <text x="454" y="256">+1</text>
      <text x="95" y="316">-1</text>
      <text x="252" y="344">+1</text>
      <text x="388" y="324">-1</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#475569">
    <rect x="60" y="358" width="18" height="6" rx="3" fill="#277da1"/>
    <text x="88" y="365">positive coupling</text>
    <rect x="226" y="358" width="18" height="6" rx="3" fill="#d95d39"/>
    <text x="254" y="365">negative coupling</text>
  </g>
</svg>
