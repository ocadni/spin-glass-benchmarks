<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="title desc">
  <title id="title">Spin-glass coupling graph</title>
  <desc id="desc">A clean network diagram where blue edges show positive couplings and red edges show negative couplings between Ising spins.</desc>
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="card-fill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <rect x="18" y="18" width="524" height="384" rx="16" fill="url(#card-fill)" filter="url(#card-shadow)"/>
  <rect x="38" y="38" width="484" height="344" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g fill="none" stroke-linecap="round" stroke-width="4.5">
    <g stroke="#2563eb" opacity="0.82">
      <line x1="112" y1="94" x2="224" y2="76"/>
      <line x1="224" y1="76" x2="340" y2="116"/>
      <line x1="340" y1="116" x2="448" y2="88"/>
      <line x1="112" y1="94" x2="166" y2="212"/>
      <line x1="282" y1="224" x2="448" y2="88"/>
      <line x1="166" y1="212" x2="96" y2="312"/>
      <line x1="96" y1="312" x2="252" y2="338"/>
      <line x1="252" y1="338" x2="390" y2="318"/>
    </g>
    <g stroke="#dc2626" opacity="0.82">
      <line x1="224" y1="76" x2="166" y2="212"/>
      <line x1="166" y1="212" x2="282" y2="224"/>
      <line x1="282" y1="224" x2="340" y2="116"/>
      <line x1="448" y1="88" x2="456" y2="250"/>
      <line x1="282" y1="224" x2="456" y2="250"/>
      <line x1="282" y1="224" x2="252" y2="338"/>
      <line x1="390" y1="318" x2="456" y2="250"/>
      <line x1="112" y1="94" x2="282" y2="224"/>
    </g>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <g fill="#172033" stroke="#ffffff" stroke-width="3">
      <circle cx="112" cy="94" r="22"/>
      <circle cx="224" cy="76" r="22"/>
      <circle cx="340" cy="116" r="22"/>
      <circle cx="448" cy="88" r="22"/>
      <circle cx="166" cy="212" r="22"/>
      <circle cx="282" cy="224" r="22"/>
      <circle cx="456" cy="250" r="22"/>
      <circle cx="96" cy="312" r="22"/>
      <circle cx="252" cy="338" r="22"/>
      <circle cx="390" cy="318" r="22"/>
    </g>
    <g fill="#ffffff">
      <text x="112" y="100">-1</text>
      <text x="224" y="82">+1</text>
      <text x="340" y="122">-1</text>
      <text x="448" y="94">+1</text>
      <text x="166" y="218">+1</text>
      <text x="282" y="230">-1</text>
      <text x="456" y="256">+1</text>
      <text x="96" y="318">-1</text>
      <text x="252" y="344">+1</text>
      <text x="390" y="324">-1</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#475569">
    <line x1="72" y1="362" x2="104" y2="362" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <text x="114" y="367">positive coupling</text>
    <line x1="254" y1="362" x2="286" y2="362" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    <text x="296" y="367">negative coupling</text>
  </g>
</svg>
